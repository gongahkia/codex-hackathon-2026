[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LastMinute"
version = "0.2.0"
description = "Security-first hackathon orchestrator with evidence-gated recommendations and hardened runtime policies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic==2.9.2",
  "typer==0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pip-audit==2.8.0",
]

[project.scripts]
LastMinute = "app.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
